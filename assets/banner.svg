<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Node & Accent Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pink-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-15px) scale(1.15); opacity: 0.9; }
      100% { transform: translateY(0px) scale(1); opacity: 0.4; }
    }
    @keyframes pulseLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ringRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .bg { fill: url(#bg-grad); }
    .network-line { stroke: #38bdf8; stroke-opacity: 0.25; stroke-width: 2; stroke-dasharray: 8 8; }
    .active-line { stroke: url(#cyan-blue); stroke-width: 3; stroke-dasharray: 120 480; animation: pulseLine 6s linear infinite; }
    .node-cyan { fill: #06b6d4; filter: url(#glow-cyan); }
    .node-pink { fill: #ec4899; filter: url(#glow-purple); }
    .particle { animation: floatParticle 4s ease-in-out infinite; }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 1.5s; }
    .p3 { animation-delay: 2.5s; }
    
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 56px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 20; }
    .badge-text { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #38bdf8; }
  </style>

  <!-- Background -->
  <rect class="bg" width="1200" height="400" rx="16" />

  <!-- Animated Neural/Agent Network Graph in Background -->
  <g opacity="0.65">
    <line x1="150" y1="80" x2="350" y2="180" class="network-line" />
    <line x1="350" y1="180" x2="200" y2="320" class="network-line" />
    <line x1="350" y1="180" x2="600" y2="120" class="network-line" />
    <line x1="600" y1="120" x2="850" y2="240" class="network-line" />
    <line x1="850" y1="240" x2="1050" y2="100" class="network-line" />
    <line x1="850" y1="240" x2="1000" y2="330" class="network-line" />

    <!-- Animated Data Stream Lines -->
    <line x1="150" y1="80" x2="1050" y2="100" class="active-line" />
    
    <!-- Network Nodes -->
    <circle cx="150" cy="80" r="8" class="node-cyan particle p1" />
    <circle cx="350" cy="180" r="12" class="node-pink particle p2" />
    <circle cx="200" cy="320" r="7" class="node-cyan particle p3" />
    <circle cx="600" cy="120" r="10" class="node-cyan particle p1" />
    <circle cx="850" cy="240" r="14" class="node-pink particle p2" />
    <circle cx="1050" cy="100" r="9" class="node-cyan particle p3" />
    <circle cx="1000" cy="330" r="7" class="node-pink particle p1" />
  </g>

  <!-- Pill Badges Header -->
  <g transform="translate(425, 60)">
    <rect class="badge-bg" x="0" y="0" width="350" height="38" />
    <text x="175" y="24" text-anchor="middle" class="badge-text">⚡ THE AGENTIC AI ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(600, 190)">
    <!-- Main Title -->
    <text x="0" y="0" text-anchor="middle" class="title-text">
      Awesome AI Agent Builder <tspan fill="url(#cyan-blue)">🤖</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="45" text-anchor="middle" class="subtitle-text">
      Curated Commercial AI Agent Platforms &amp; Open-Source Frameworks
    </text>
    
    <!-- Tagline Chips -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#cbd5e1" font-weight="500">
        Low-Code Agent Builders • Visual Workflow Editors • Multi-Agent Orchestration • RAG Pipelines
      </text>
    </g>
  </g>
</svg>
